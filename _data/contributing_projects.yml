- status: current
  role: Principal investigator
  name: "MEDIATION"
  period: "2022–2028"
  funding: "ANR / French Priority Research Program on Ocean & Climate"
  description: >-
    Studies the effects of climate and socio-economic change on the ocean,
    biogeochemical cycles, and marine ecosystems, with applications to the
    coasts of metropolitan France.

    MEDIATION's work spanning applied mathematics and computer science focuses
    on uncertainty modeling and propagation through model chains; the
    development of intermediate-complexity models; high-performance computing;
    and artificial intelligence.
  website: "http://www.mediation-ocean.org"
